<script type="text/javascript">
	$(document).ready(function(){
		var word = "{{单词}}";
   		$("em").replaceWith("______");
			$("#eudictDiv span[class*='key']").replaceWith("______");

	{{#牛津双解}}
		//牛津辞典关键字mask
		$(".top-g .h,.top-g .ei-g,.top-g .dr,.dr-g,.infl,.xr-g,.if-g,.ifs-g,.derived,.wordbox,.table,.symbols-small_coresym,.symbols-coresym,.help,.ei-g,.vs-g").hide();

		var inflHtml = $(".infl .inflection");
		var inflections = []
		if(inflHtml.length>0){
			for (var i = inflHtml.length-1; i >= 0; i--) {
                var inflect = $(inflHtml[i]).text()
				inflections.push(new RegExp( '(' + inflect + ')', 'gi' ));
			}	
		}
		inflections.push(new RegExp( '(' + word + ')', 'gi' ));

		$("#oalecd8e span[id*='xg'],#oalecd8e span[class*='def'],#oalecd8e span[class*='alt'],#oalecd8e span[class*='pv'],#oalecd8e span[class*='id']").each(function () {
			var html = $(this).html();
			for(var i = 0;i < inflections.length;i++) {
				html = html.replace("ˈ","");
				html = html.replace(inflections[i],"______");
			}
			$(this).html(html);
		});  
	{{/牛津双解}}  


	$("#eudictDivButton").on
 	$("#eudictDivButton").click(function(){
			$("#eudictDiv").toggle();
  });

	$("#oalecd8eButton").on
	$("#oalecd8eButton").click(function(){
  		$("#oalecd8e").toggle();
	});

	$("#explanationRateButton").on
	$("#explanationRateButton").click(function(){
  		$("#explanationRate").toggle();
	});

	$("#dreyefullButton").on
 	$("#dreyefullButton").click(function(){
     $("#dreyefullDiv").toggle();
  });
 });
</script>
