<!-- 脚本 -->
<script type="text/javascript">
	$(document).ready(function(){
		var word = "{{单词}}";
   	
		//获取随机数，随机展示卡片
		var random = Math.floor(Math.random()*10)%2;
		var random = 1;
		
		if(random==0){
			//$("#showAudioCardDiv").remove()
			$("#showWordCardDiv").show()
		}else {
			//$("#showAudioCardDiv").remove()

			$("em").replaceWith("______");
    		$("#eudictDiv span[class*='key']").replaceWith("______");
    
			//辞典关键字mask
    		$("span[class*='hyphenation'],.neutral,.amevarpron,.pron,.popup-button,.collobox,.top-g .h,.top-g .ei-g,.top-g .dr,.dr-g,.infl,.xr-g,.if-g,.ifs-g,.derived,.wordbox,.table,.symbols-small_coresym,.symbols-coresym,.help,.ei-g,.vs-g").hide();
    		
			var inflections = []
			var wfwdHtml = $("span .wfwd");
			if(wfwdHtml.length>0){
    			for (var i = wfwdHtml.length-1; i >= 0; i--) {
            		var inflect = $(wfwdHtml[i]).text()
    				inflections.push(new RegExp( '(' + inflect + ')', 'gi' ));
 				}	
    		}
    		var inflHtml = $(".infl .inflection");
    		if(inflHtml.length>0){
    			for (var i = inflHtml.length-1; i >= 0; i--) {
            		var inflect = $(inflHtml[i]).text()
    				inflections.push(new RegExp( '(' + inflect + ')', 'gi' ));
 				}	
    		}
    		inflections.push(new RegExp( '(' + word + ')', 'gi' ));
        
    		$("#wordfamilyDiv span,#oalecd8e span[id*='xg'],#oalecd8e span[class*='def'],#oalecd8e span[class*='alt'],#oalecd8e span[class*='pv'],#oalecd8e span[class*='id'],#oalecd8e span[class*='cf']").each(function () {     
    			var html = $(this).html();
    			for(var i = 0;i < inflections.length;i++) {
    				html = html.replace("ˈ","");
    				html = html.replace(inflections[i],"______");
    			}
    			$(this).html(html);
    		});  
   

            $("#eudictDivButton").on
            $("#eudictDivButton").click(function(){
                $("#eudictDiv").toggle();
            });
        
            $("#oalecd8eButton").on
            $("#oalecd8eButton").click(function(){
                $("#oalecd8e").toggle();
            });
        
            $("#explanationRateButton").on
            $("#explanationRateButton").click(function(){
                $("#explanationRate").toggle();
            });
        
            $("#dreyefullButton").on
            $("#dreyefullButton").click(function(){
                $("#dreyefullDiv").toggle();
            });
            $("#showExplanationdDiv").show();

            //牛津中文释义
            $("._oalecd8e .x-g:before").toggle();
            $("._oalecd8e  .oalecd8e_chn").toggle();
            $("#oalecd8eBtnChinese").click(function(){
                //$("._oalecd8e .x-g .oalecd8e_chn").toggle();
                //$("._oalecd8e .d .oalecd8e_chn,._oalecd8e .ud .oalecd8e_chn").toggle();
                $("._oalecd8e .x-g:before").toggle();
                $("._oalecd8e .oalecd8e_chn").toggle();     
            });

            //examples中文释义 
            $("#examplesBtnChinese").click(function(){ 
                $(".lj_item .channel").toggle();	
                $(".lj_item .content .exp").toggle();	
            });
            
			//wordfamily
			$("#wordfamilyButton").on
			$("#wordfamilyButton").click(function(){
     		 $("#wordfamilyDiv").toggle();	
			});

            //wfChinese中文释义
            $("#wordfamilyDiv tran").toggle();
            $("#wordfamilyDiv example").toggle();
            $("#wfBtnChinese").click(function(){
                $("#wordfamilyDiv tran").toggle();	
                $("#wordfamilyDiv example").toggle();
            });
            //dreyeChinese中文释义
            $("#dreyefullChinese").click(function(){
        
            });
		}
		
});
</script>
