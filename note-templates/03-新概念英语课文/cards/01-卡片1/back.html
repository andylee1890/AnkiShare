<h1>Lesson {{Lesson}}</h1>
	<div class="textMain">
		<p>{{正面}}</p>
		
		{{#audio}}
		<p id="originAudio"style="font-size: 10px;text-align: center;">{{audio}}</p>		
		{{/audio}}
		<p id ="anser"><b style="color:#984806">{{背面}}</b></p>
	</div>

<!-- -------- extra begin -------- -->
{{#points}}
	<br>
	<div class="hintBtnBox">
		<button id ="pointsButton" class=hintBtn>知识点概况</button>
		<br>
	</div>
	<div id ="points" class=hint>
		<b>{{points}}</b>
	</div>
	<hr>
{{/points}}
{{#notes}}
<br>
	<div class="hintBtnBox">
		<button id ="notesButton" class=hintBtn>课文笔记</button>
		<br>
	</div>
	<div id ="notes" class=hint>
		{{notes}}
	</div>
{{/notes}}

{{#words}}
<br>
	<div class="hintBtnBox">
		<button id ="wordsButton" class=hintBtn>单词笔记</button>
		<br>
	</div>
	<div id ="words" class=hint>
		{{words}}
	</div>
{{/words}}
{{#Question}}
	<br>
	<div class="hintBtnBox">
		<button id ="QuestionButton" class=hintBtn>Question</button>
		<br>=
	</div>
	<div id ="Question" class=hint>
		{{Question}}
	</div>
{{/Question}}


<script type="text/javascript">
	window.onload = function(){
	   
	};

	//$("#anser").hide();
	$("#anserButton").on
	$("#anserButton").click(function(){
		$("#anser").toggle();
	});


	$("#pointsButton").on
	$("#pointsButton").click(function(){
		$("#points").toggle();
	});
	$("#notesButton").on
	$("#notesButton").click(function(){
  		$("#notes").toggle();
	});

  $("#wordsButton").on
	$("#wordsButton").click(function(){
  		$("#words").toggle();
	});

	$("#QuestionButton").on
	$("#QuestionButton").click(function(){
  		$("#Question").toggle();
	});

</script>
<!-- -------- extra end -------- -->
<script type="text/javascript">
(function () {
  function spaceFooter() {
    var footer = document.querySelector('.english-anchor-footer');
    if (!footer) return;
    footer.style.marginTop = '';
    var gap = window.innerHeight - footer.getBoundingClientRect().bottom - 8;
    if (gap > 0) footer.style.marginTop = (28 + gap) + 'px';
  }
  spaceFooter();
  setTimeout(spaceFooter, 100);
  window.addEventListener('resize', spaceFooter);
})();
</script>
<footer class="english-anchor-footer">
  <a href="https://englishanchor.online">English Anchor</a>
  <span>英语学习资源</span>
</footer>
